name: Quantization kernels

on:
  push:
    branches: [main]
    paths:
      - "quant-kernels/**"
      - "src/vector/**"
      - "benches/**"
      - ".github/workflows/quant-kernels.yml"
  pull_request:
    paths:
      - "quant-kernels/**"
      - "src/vector/**"
      - "benches/**"
      - ".github/workflows/quant-kernels.yml"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-paths:
    name: Select quantization jobs
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.filter.outputs.kernels }}
      tantivy_benches: ${{ steps.filter.outputs.tantivy_benches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/quantization-changed-files"
          if grep -Eq '^(quant-kernels/|\.github/workflows/quant-kernels\.yml$)' "$RUNNER_TEMP/quantization-changed-files"; then
            echo "kernels=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernels=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(quant-kernels/|src/vector/|benches/|\.github/workflows/quant-kernels\.yml$)' "$RUNNER_TEMP/quantization-changed-files"; then
            echo "tantivy_benches=true" >> "$GITHUB_OUTPUT"
          else
            echo "tantivy_benches=false" >> "$GITHUB_OUTPUT"
          fi

  kernel-checks-x86:
    name: Kernel checks and x86 assembly
    needs: changed-paths
    if: needs.changed-paths.outputs.kernels == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_BENCH_LTO: thin
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly rustfmt
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: nightly
          profile: minimal
          components: rustfmt
      - name: Install pinned stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.95.0
          profile: minimal
          components: clippy
          override: true
      # Native target artifacts are deliberately not cached: hosted x86 runners
      # are heterogeneous and may not support a previous host's instructions.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
      - name: Run kernel goldens, determinism, clippy, and tests
        run: ./quant-kernels/check.sh
      - name: Check x86 assembly expectations
        run: ./quant-kernels/check_asm_x86.sh
      - name: Run kernel Criterion targets
        run: |
          cargo bench -p fht --bench rotation -- --noplot
          cargo bench -p sign-plane --bench score -- --noplot
          cargo bench -p grid-plane --bench kernels -- --noplot
          cargo bench -p cascade --bench baselines -- --noplot
          cargo bench -p cascade --bench cascade -- --noplot

  kernel-assembly-arm:
    name: ARM assembly expectations
    needs: changed-paths
    if: needs.changed-paths.outputs.kernels == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_TARGET_DIR: target/quant-kernels-asm-arm
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.95.0
          profile: minimal
          override: true
      - name: Check ARM popcount assembly
        run: |
          cargo rustc -p sign-plane --release --lib -- --emit=asm
          sign_asm=$(find "$CARGO_TARGET_DIR/release/deps" -name 'sign_plane-*.s' -print | head -n 1)
          test -n "$sign_asm"
          grep -Eq '\bcnt\b' "$sign_asm"

  tantivy-quantization-benches:
    name: Tantivy quantization benchmarks
    needs: changed-paths
    if: needs.changed-paths.outputs.tantivy_benches == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_BENCH_LTO: thin
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.95.0
          profile: minimal
          override: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run available tantivy quantization benchmarks
        run: |
          if test -f benches/vector_quantization_writer.rs; then
            cargo bench -p tantivy --bench vector_quantization_writer -- --noplot
          fi
          if test -f benches/vector_quantization_scan.rs; then
            cargo bench -p tantivy --bench vector_quantization_scan --features quantization-bench -- --noplot
          fi
