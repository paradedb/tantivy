name: Quantization kernels

on:
  push:
    branches: [main]
    paths:
      - "quant/**"
      - "src/vector/**"
      - "benches/**"
      - ".github/workflows/quant-kernels.yml"
  pull_request:
    paths:
      - "quant/**"
      - "src/vector/**"
      - "benches/**"
      - ".github/workflows/quant-kernels.yml"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-paths:
    name: Select quantization jobs
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.filter.outputs.kernels }}
      tantivy_benches: ${{ steps.filter.outputs.tantivy_benches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/quantization-changed-files"
          if grep -Eq '^(quant/|\.github/workflows/quant-kernels\.yml$)' "$RUNNER_TEMP/quantization-changed-files"; then
            echo "kernels=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernels=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(quant/|src/vector/|benches/|\.github/workflows/quant-kernels\.yml$)' "$RUNNER_TEMP/quantization-changed-files"; then
            echo "tantivy_benches=true" >> "$GITHUB_OUTPUT"
          else
            echo "tantivy_benches=false" >> "$GITHUB_OUTPUT"
          fi

  kernel-checks-x86:
    name: Kernel checks and x86 assembly
    needs: changed-paths
    if: needs.changed-paths.outputs.kernels == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_BENCH_LTO: thin
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly rustfmt
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: nightly
          profile: minimal
          components: rustfmt
      - name: Install pinned stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.95.0
          profile: minimal
          components: clippy
          override: true
      # Native target artifacts are deliberately not cached: hosted x86 runners
      # are heterogeneous and may not support a previous host's instructions.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
      - name: Run kernel goldens, determinism, clippy, and tests
        run: ./quant/check.sh
      - name: Check x86 assembly expectations
        run: ./quant/check_asm_x86.sh
      - name: Run kernel Criterion targets
        run: |
          cargo bench -p tantivy-quant --bench rotation -- --noplot
          cargo bench -p tantivy-quant --bench sign_score -- --noplot
          cargo bench -p tantivy-quant --bench grid_kernels -- --noplot
          cargo bench -p tantivy-quant --bench baselines -- --noplot
          cargo bench -p tantivy-quant --bench cascade -- --noplot

  kernel-assembly-arm:
    name: ARM assembly expectations
    needs: changed-paths
    if: needs.changed-paths.outputs.kernels == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_TARGET_DIR: target/quant-asm-arm
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.95.0
          profile: minimal
          override: true
      - name: Check ARM popcount assembly
        run: |
          cargo rustc -p tantivy-quant --release --lib -- --emit=asm
          quant_asm=$(find "$CARGO_TARGET_DIR/release/deps" -name 'tantivy_quant-*.s' -print | head -n 1)
          test -n "$quant_asm"
          # The functions under tantivy_quant::sign, each from its label to its `.cfi_endproc` or
          # the next symbol label.
          sign_asm="$CARGO_TARGET_DIR/tantivy_quant-sign.s"
          awk '
            in_fn && (/\.cfi_endproc/ || (/^[A-Za-z_$][^:]*:/ && !/^[Ll]/)) { in_fn = 0 }
            /^_?_ZN13tantivy_quant4sign[^:]*:/ { in_fn = 1 }
            in_fn { print }
          ' "$quant_asm" > "$sign_asm"
          if [ ! -s "$sign_asm" ]; then
            echo "no tantivy_quant::sign functions found in $quant_asm" >&2
            exit 1
          fi
          if ! grep -Eq '\bcnt\b' "$sign_asm"; then
            echo "tantivy_quant::sign assembly does not contain a cnt instruction" >&2
            exit 1
          fi

  kernel-tier-avx512:
    name: AVX-512 tier under Intel SDE
    needs: changed-paths
    if: needs.changed-paths.outputs.kernels == 'true'
    runs-on: ubuntu-latest
    # No target-cpu: the emulated CPU need not support every instruction the runner does.
    env:
      CARGO_TARGET_DIR: target/quant-sde
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.95.0
          profile: minimal
          override: true
      - name: Install Intel SDE
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      - name: Run sign and f16 tests on an emulated Sapphire Rapids CPU
        run: |
          test_bin=$(cargo test -p tantivy-quant --release --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable')
          test -n "$test_bin"
          "$SDE_PATH/sde64" -spr -- "$test_bin" --include-ignored sign::tests:: model::f16::tests::

  tantivy-scan-benches:
    name: Tantivy quantization benchmarks
    needs: changed-paths
    if: needs.changed-paths.outputs.tantivy_benches == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_BENCH_LTO: thin
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.95.0
          profile: minimal
          override: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run available tantivy quantization benchmarks
        run: |
          if test -f benches/vector_quantization_writer.rs; then
            cargo bench -p tantivy --bench vector_quantization_writer -- --noplot
          fi
          if test -f benches/vector_quantization_scan.rs; then
            cargo bench -p tantivy --bench vector_quantization_scan --features unstable -- --noplot
          fi
